[project]
name = "simple-autoresearch"
version = "0.1.0"
description = "A teaching-first lightweight auto-research pipeline inspired by AutoResearchClaw."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arxiv>=3.0.0",
    "litellm>=1.86.2",
    "pyalex>=0.21",
    "pydantic>=2.13.3",
    "pypdf>=6.12.2",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "scikit-learn>=1.8.0",
    "tqdm>=4.67.3",
]

[project.scripts]
simple-ar = "simple_ar.cli:main"
simple-ar-checks = "simple_ar.app.dev_checks:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_ar"]
