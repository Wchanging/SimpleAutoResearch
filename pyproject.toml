[project]
name = "simple-autoresearch"
version = "0.1.0"
description = "A teaching-first lightweight auto-research pipeline inspired by AutoResearchClaw."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
simple-ar = "simple_ar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simple_ar"]
