[run]
# Required unless --topic is supplied on the CLI.
topic = "improve tiny digits MLP"

# Timestamped run directories are created here.
output_root = "runs"

# The default start stage is plan. This example runs the whole pipeline.
to_stage = "report"

[llm]
# code_task_project needs LLM mode for real patch planning/edit proposal.
enabled = true

[search]
# This example focuses on the code-task mechanics, so it avoids live search.
offline = true
max_papers = 5

[research]
# V2.3 source planner settings for 02-search. Because this is an offline
# coding-focused demo, the plan records fixture metadata rather than live
# provider calls.
mode = "lite"
planner = "auto"
sources = ["fixture"]
queries = ["tiny digits MLP baseline improvement"]
auto_query_expansion = true
max_retrieval_rounds = 1
max_queries = 4
required_facets = ["method", "benchmark", "dataset"]
cache = true
index_backend = "keyword"

[research.budget]
max_documents = 5
max_chunks = 50
max_context_tokens = 6000
max_llm_calls = 4

[experiment]
# Generic embedded existing-code workflow.
template = "code_task_project"
timeout = 60

[task]
# Unified V2.5 task identity. The legacy [code_task] section below is retained
# so the same file can still be reused by standalone code-task commands.
kind = "existing_project"
name = "tiny-digits-mlp-pipeline"
objective = "Improve the local tiny digits MLP benchmark without changing tests."
code_root = "../project"
task_file = "../task.md"

[implementation]
mode = "patch_existing"
domain_profile = "ml_experiment"
provider = "local"
# Embedded 8-stage runs can merge the user task file with research-derived
# context from 01-plan..04-synthesize before entering code-task execution.
task_handoff = "merge"
allow_external_agent = false
max_repair_attempts = 1

[execution]
backend = "local"
command = "python benchmark.py"
timeout_sec = 60
stream_output = "auto"
# auto/run executes the unchanged benchmark before patching; expensive
# baselines can use skip/none or provided + baseline_metrics_file.
baseline_policy = "auto"
# baseline_metrics_file = "baseline_metrics.json"
allow_dependency_install = false

[resource]
max_runtime_sec = 60
max_files = 6
max_generated_lines = 700
max_memory_mb = 2048
allow_gpu = false

[evaluation]
primary_metric = "accuracy"
direction = "maximize"
required_metrics = ["accuracy", "macro_f1"]
success_criteria = ["accuracy should improve or avoid regression"]
metric_directions = { accuracy = "higher", macro_f1 = "higher", train_time_sec = "resource", inference_time_ms = "resource", params = "resource" }

[generation]
enabled = false
max_batches = 2
files_per_batch = 3
review_required = true

[report]
mode = "auto"
template = "experiment"
criteria = "auto"
allow_source_backtracking = true

[report.audit]
citations = true
metrics = true
claims = true

[code_task]
# Project prepared under 06-code/code_task_run/code_task/workspace.
code_root = "examples/full_pipeline_tiny_mlp/project"

# Optional for embedded pipeline runs. If omitted, 05-design generates
# generated_code_task.md from the research artifacts and codebase summary.
# With [implementation].task_handoff = "merge", this file is treated as hard
# user requirements and merged with research context into generated_code_task.md.
task_file = "examples/full_pipeline_tiny_mlp/task.md"
name = "tiny-digits-mlp-pipeline"

[workspace]
# auto prefers git_worktree for committed Git projects and falls back to copy
# with a recorded reason. Use explicit copy when you need uncommitted local
# files; use explicit git_worktree when fallback should be treated as an error.
# sparse_copy is experimental; if used, uncomment include/exclude patterns.
mode = "auto"
# include = ["digits_mlp/**", "tests/**", "benchmark.py", "pyproject.toml"]
# exclude = ["data/**", "models/**"]
reuse_source_venv = false
setup_hook = ""

[edit_scope]
# Embedded code-task runs reuse this scope when the same TOML is used as the
# nested code-task config.
allowed_patterns = ["digits_mlp/**"]
protected_patterns = []

[benchmark]
# Runs inside the editable workspace before and after the patch.
command = "python benchmark.py"
primary_metric = "accuracy"

[benchmark.metric_directions]
# Directions may be higher, lower, resource, or ignore.
accuracy = "higher"
macro_f1 = "higher"
train_time_sec = "resource"
inference_time_ms = "resource"
params = "resource"

[environment]
# current uses the active SimpleAutoResearch Python. No dependencies are installed.
mode = "current"

[safety]
# Maximum copied source file size. Use 0 to disable.
# Tests and benchmark files remain read-only patch evidence by default.
max_file_bytes = 2000000
# Embedded 8-stage code-task runs operate inside an isolated workspace and run
# post-apply review/validation/benchmark gates, so this example allows a single
# larger old/new replacement when the model proposes a cohesive implementation.
allow_large_edits = true
