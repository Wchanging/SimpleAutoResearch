[code_task]
code_root = "examples/code_tasks/tiny_digits_mlp_project"
task_file = "examples/code_tasks/tasks/improve_tiny_digits_mlp.md"
output_root = "runs"
name = "tiny-digits-mlp"

[benchmark]
command = "python benchmark.py"
primary_metric = "accuracy"

[benchmark.metric_directions]
accuracy = "higher"
macro_f1 = "higher"
train_time_sec = "resource"
inference_time_ms = "resource"
params = "resource"

[environment]
mode = "current"

[workspace]
# copy is the safest default. git_worktree is available for repo-root projects.
# sparse_copy is experimental; when used, add include/exclude patterns here.
mode = "copy"
# include = ["digits_mlp/**", "tests/**", "benchmark.py", "pyproject.toml"]
# exclude = ["data/**", "models/**"]
reuse_source_venv = false
setup_hook = ""

[safety]
# Tests and benchmark files remain read-only patch evidence by default.
max_file_bytes = 2000000
