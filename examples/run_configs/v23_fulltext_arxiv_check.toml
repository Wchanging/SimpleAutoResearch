[run]
# V2.3 realistic online research-chain check.
# This run stops at synthesize so you can inspect live retrieval, full-text
# ingestion, read-stage Paper Briefs, and the compact synthesis brief without
# running design/code/run/report.
topic = "multi-agent collaboration for coding agents"
output_root = "runs/v23-fulltext-arxiv-check"
to_stage = "synthesize"
# Keep default runs lean. Set this to true only when you need planning traces,
# retrieval-selection rows, coverage diagnostics, tool contracts, and retention-policy
# artifacts for debugging.
debug_artifacts = false

[llm]
# Exercise the LLM-backed research-question and query planner.
# Provider/model settings still come from .env unless you uncomment model.
enabled = true
# model = "gpt-4o-mini"

[search]
# Real online metadata search. No fixture fallback is allowed here: if all live
# providers fail, the run should fail so the test does not look evidence-backed
# when it is not.
offline = false
strict = true
allow_fixture_fallback = false

# Keep this extremely small because arXiv can rate-limit repeated development
# runs. This config is a Day11 full-text smoke, not a broad survey.
max_papers = 3
query = "multi-agent collaboration for coding agents"

[research]
# strong marks this as a parser/full-text-oriented check. The implementation is
# still guarded: only one remote PDF is fetched by default.
mode = "strong"
planner = "llm"

# Online fallback order. The run tries arXiv first because it gives predictable
# PDF URLs; if arXiv is rate-limited, it falls through to OpenAlex and then
# Semantic Scholar. Do not add local_files here; this is intentionally not a
# local demo.
sources = ["arxiv", "openalex", "semantic_scholar"]

# Seed query is intentionally arXiv-friendly. We still use the LLM planner for
# research-question decomposition, but query expansion is disabled below so the
# run sends only one live arXiv request.
queries = [
  "multi-agent collaboration for coding agents",
]

auto_query_expansion = false
max_retrieval_rounds = 1
max_queries = 1
required_facets = ["overview", "method", "benchmark"]

# No local demo documents: all evidence should come from live arXiv metadata
# and the remote PDF selected by the full-text manifest.
local_documents = []

# Day11 full-text path:
# - use_fulltext selects eligible resources;
# - allow_pdf_download permits remote PDF fetches from arXiv/OpenAlex when available;
# - keep_raw_pdf keeps downloaded files so pypdf can parse them;
# - max_fulltext_documents keeps the test cheap and safe.
use_fulltext = true
allow_pdf_download = true
max_fulltext_documents = 3
max_pdf_mb = 15
keep_raw_pdf = true
parser_backend = "pypdf"

# 03-read uses a two-step LLM review: first screen compact abstract batches,
# then rerank the kept set for Paper Brief generation and synthesis. These
# values are intentionally modest for local use; increase read_max_shortlist
# for broader surveys.
read_screening = "llm"       # auto | llm | deterministic
read_batch_size = 4
read_workers = 3
read_max_shortlist = 3

# Disable metadata cache fallback so this check uses a real live query. The
# downloaded PDF itself is still stored in the run-local fulltext_cache.
cache = false
index_backend = "sqlite_fts"
# SQLite/LanceDB accelerator stores are shared by default. Keep this explicit
# for the full-text check so repeated runs update one local research index.
index_root = ".simple_ar_cache/research_index"

[research.budget]
max_documents = 3
max_chunks = 120
max_context_tokens = 10000
max_llm_calls = 3
max_follow_up_queries = 0
novelty_backend = "local"

[retrieval]
enabled = true
top_k = 6

[report]
# Useful if you later change to_stage to report, but this check normally stops
# at synthesize.
mode = "research_only"
