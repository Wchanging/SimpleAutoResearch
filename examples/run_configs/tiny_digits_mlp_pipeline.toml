[run]
# Required unless --topic is supplied on the CLI.
topic = "improve tiny digits MLP"

# Timestamped run directories are created here.
output_root = "runs"

# The default start stage is plan. This example runs the whole pipeline.
to_stage = "report"

[llm]
# code_task_project needs LLM mode for real patch planning/edit proposal.
enabled = true

[search]
# This example focuses on the code-task mechanics, so it avoids live search.
offline = true
max_papers = 5

[experiment]
# Generic embedded existing-code workflow.
template = "code_task_project"
timeout = 60

[report]
mode = "auto"

[code_task]
# Project copied into 06-code/code_task_run/code_task/workspace.
code_root = "examples/code_tasks/tiny_digits_mlp_project"

# Task prompt used by the LLM patch planner.
task_file = "examples/code_tasks/tasks/improve_tiny_digits_mlp.md"
name = "tiny-digits-mlp-pipeline"

[benchmark]
# Runs inside the copied workspace before and after the patch.
command = "python benchmark.py"
primary_metric = "accuracy"

[benchmark.metric_directions]
# Directions may be higher, lower, resource, or ignore.
accuracy = "higher"
macro_f1 = "higher"
train_time_sec = "resource"
inference_time_ms = "resource"
params = "resource"

[environment]
# current uses the active SimpleAutoResearch Python. No dependencies are installed.
mode = "current"

[safety]
# Maximum copied source file size. Use 0 to disable.
# Tests and benchmark files remain read-only patch evidence by default.
max_file_bytes = 2000000
