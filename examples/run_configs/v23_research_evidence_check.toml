[run]
# V2.3 research/evidence check config.
# Default scope is Day26-friendly: stop at search so you can inspect the
# research-question, query-plan, source-plan, retrieval, screening, coverage,
# evidence, tool-contract, and local-index artifacts.
topic = "multi-agent collaboration for coding agents"
output_root = "runs/v23-research-evidence-check"
to_stage = "search"
debug_artifacts = false

[llm]
# Required when you want to validate the LLM-backed research planner.
# The provider settings still come from .env / environment variables.
enabled = true
# model = "gpt-4o-mini"

[search]
# Online multi-source metadata check for V2.3 retrieval/screening. Keep the
# limit small because public literature APIs can rate-limit repeated runs.
offline = false
max_papers = 3
query = "multi-agent collaboration for coding agents"

# Leave fixture fallback off by default so missing local documents or future
# connector failures remain visible during V2.3 development.
allow_fixture_fallback = false
strict = false

[research]
# standard records cache/index-ready intent while staying lightweight enough
# for local development.
mode = "standard"

# llm explicitly exercises the model-backed question/query planner. Use
# "auto" when you want LLM if enabled and deterministic fallback otherwise;
# use "deterministic" for no-extra-LLM regression checks.
planner = "llm"

# Online paper metadata source order for this check. OpenAlex is first because
# it is usually more tolerant for broad metadata search; Semantic Scholar adds
# useful citation/abstract coverage; arXiv remains the preprint fallback.
# The current strategy is ordered fallback per query, not full provider union:
# once a source returns candidates, later sources are skipped for that query.
# For stable local-only checks, switch back to:
# sources = ["local_files"]
# and set [search].offline = true.
sources = ["openalex", "semantic_scholar", "arxiv"]

# Seed queries are used by the planner before LLM/planner expansion; the full
# planning artifact is retained only when debug_artifacts = true.
queries = [
  "multi-agent collaboration for coding agents",
  "LLM agents software engineering benchmark",
]

auto_query_expansion = true
max_retrieval_rounds = 2
max_queries = 8
required_facets = ["overview", "method", "benchmark", "dataset", "code_link", "limitation"]

# Keep empty for this online test. Add Markdown/text paths only when you want
# local notes to be included as additional evidence records.
local_documents = []

# These flags are recorded in documents/cache_manifest.json and
# documents/fulltext_manifest.json. Remote PDF download is guarded by
# use_fulltext, allow_pdf_download, max_fulltext_documents, and max_pdf_mb.
# Cached/local text and basic HTML are parsed into documents/fulltext_extraction.json;
# PDFs remain best-effort and require an optional parser.
use_fulltext = false
allow_pdf_download = false
max_fulltext_documents = 3
max_pdf_mb = 20
keep_raw_pdf = false
parser_backend = "basic"
cache = true
index_backend = "sqlite_fts"

[research.budget]
max_documents = 5
max_chunks = 120
max_context_tokens = 8000
max_llm_calls = 6
max_follow_up_queries = 3

[retrieval]
enabled = true
top_k = 6

[report]
# Useful if you change to_stage to synthesize/report for later V2.3 checks.
mode = "research_only"
